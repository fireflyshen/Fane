[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Fane"
version = "2.2.0"
requires-python = ">=3.11"
description = "Convert and sync bills, apply classifications, and manage recurring entries and Beancount ledgers"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "typer",
    "pandas",
    "openpyxl",
    "pydantic",
    "jinja2",
    "pyyaml",
    "beancount>=3.2.3,<4"
]

[project.optional-dependencies]
cloud = ["boto3>=1.35,<2"]
web = ["fava"]

[project.scripts]
fa = "fane.cli:app"

[tool.setuptools]

[tool.setuptools.package-dir]
package = "compat/package"
provider = "compat/provider"
ir = "compat/ir"

[tool.setuptools.packages.find]
where = [".", "compat"]
include = ["fane*", "ir*", "package*", "provider*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["*.j2", "*.json", "*.yaml"]

[tool.basedpyright]
reportOptionalMemberAccess = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "build>=1.6.1",
    "twine>=7.0.0",
]
