[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Fane"
version = "1.4.10"
description = "Convert Alipay and WeChat bills into Beancount entries"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "typer",
    "pandas",
    "openpyxl",
    "pydantic",
    "jinja2",
    "pyyaml"
]

[project.scripts]
fa = "package.cmd:app"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]
include = ["ir*", "achive*", "package*", "provider*", "compiler*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["*.j2", "*.json", "*.yaml"]

[tool.basedpyright]
reportOptionalMemberAccess = false
