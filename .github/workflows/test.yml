name: test

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e .
      - run: FANE_STATE_HOME=/tmp/fane-test-state python -m unittest discover -s tests -v
      - run: python -m unittest discover -s integrations/n8n -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node integrations/n8n/test_report.js
      - run: python -m compileall -q fane tests integrations/n8n
